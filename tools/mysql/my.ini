# StoneERP-AI-Assistant — project-local MySQL 8.4 LTS (portable, no Windows service)
# Paths use forward slashes; MySQL on Windows accepts them for basedir/datadir.

[mysqld]
basedir=D:/MARCOM_PROJECTS/PrivateProjects/StoneERP-AI-Assistant/tools/mysql/server
datadir=D:/MARCOM_PROJECTS/PrivateProjects/StoneERP-AI-Assistant/tools/mysql/data
port=3307
bind-address=127.0.0.1
character-set-server=utf8mb4
collation-server=utf8mb4_0900_ai_ci
mysqlx=0
local_infile=0
log-error=D:/MARCOM_PROJECTS/PrivateProjects/StoneERP-AI-Assistant/tools/mysql/logs/error.log
pid-file=D:/MARCOM_PROJECTS/PrivateProjects/StoneERP-AI-Assistant/tools/mysql/data/mysqld.pid

[client]
port=3307
default-character-set=utf8mb4
